name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      # Node 22.12 ships npm 10.9.0, which can terminate `npm ci` with the
      # internal "Exit handler never called" error on GitHub-hosted runners.
      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit high-severity dependencies
        run: npm run audit

      - name: Type-check, build, and validate output
        run: npm test

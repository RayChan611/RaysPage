name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # The bundled npm 10 release can terminate `npm ci` with the
      # internal "Exit handler never called" error on GitHub-hosted runners.
      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Audit high-severity dependencies
        run: npm run audit

      - name: Type-check, build, and validate output
        run: npm test

      - name: Install Chromium and WebKit for browser regression tests
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop and mobile browser regression tests
        run: npm run test:e2e

      # EdgeOne publishes the committed dist/ directory. A source-only change
      # must therefore fail CI until its freshly generated output is committed.
      - name: Verify committed site output is current
        shell: bash
        run: |
          git diff --exit-code -- dist

          untracked_dist_files="$(git ls-files --others --exclude-standard -- dist)"
          if [[ -n "$untracked_dist_files" ]]; then
            echo "Generated dist/ files are missing from the commit:"
            echo "$untracked_dist_files"
            exit 1
          fi

<section class="essay-hero"><div class="container"><h1 class="essay-hero-title"><p>星辰之子</p></h1><div class="essay-meta"><span class="essay-date"><p>2026.07.07</p></span><span class="essay-tag"><p>Cosmos</p></span></div></div></section>
<article class="essay-content section"><div class="container"><div class="essay-body"><p class="essay-quote-text"><p>“地球这样的行星，是产生不了重元素的，你身体里的铁，来自璀璨的超新星爆炸”</p></p><p class="essay-quote-text"><p>“血液里的锌，源自两次中子星对撞后喷射向宇宙的尘埃”</p></p><p class="essay-quote-text"><p>“那微量的铜，更是需要见证一颗白矮星的死亡，即使是最微不足道的钴，也源自几十亿光年外的星云”</p></p><p class="essay-quote-text"><p>“某种意义上讲，人类对星空怀有好奇，是正常的。”</p></p><p class="essay-quote-text"><p>“渴望见证星河大海的极限，因为我们本就是星辰之子。”</p></p></div></div></article>  <footer class="footer" data-astro-cid-ixa6lmsc> <div class="container" data-astro-cid-ixa6lmsc> <p class="footer-copy" data-astro-cid-ixa6lmsc>&copy; 2026 Ray Chan. Built with Devotion.</p> </div> </footer> <button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top" data-astro-cid-ixa6lmsc> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-astro-cid-ixa6lmsc> <path d="M12 19V5" data-astro-cid-ixa6lmsc></path> <path d="M5 12l7-7 7 7" data-astro-cid-ixa6lmsc></path> </svg> </button> <!-- Global client scripts (load order matters: lenis before smooth-scroll). --> <script src="/js/vendor/lenis.min.js"></script> <script src="/js/smooth-scroll.js"></script> <script src="/js/cursor.js"></script> <script src="/js/nav.js"></script>  </body></html> <script defer src="/js/hero-sparkle.js"></script> <script defer src="/js/back-lift.js"></script>

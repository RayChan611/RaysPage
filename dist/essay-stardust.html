  <article class="essay-content section">

      <div class="essay-body">

        <p class="essay-quote-text">"地球这样的行星，是产生不了重元素的，你身体里的铁，来自璀璨的超新星爆炸"</p>

        <p class="essay-quote-text">"血液里的锌，源自两次中子星对撞后喷射向宇宙的尘埃"</p>

        <p class="essay-quote-text">"那微量的铜，更是需要见证一颗白矮星的死亡，即使是最微不足道的钴，也源自几十亿光年外的星云"</p>

        <p class="essay-quote-text">"某种意义上讲，人类对星空怀有好奇，是正常的。"</p>

        <p class="essay-quote-text">"渴望见证星河大海的极限，因为我们本就是星辰之子。"</p>
